<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-labelledby="t d">
  <title id="t">A rough homepage sketch</title>
  <desc id="d">A pencil wireframe of a homepage: a header with a logo and menu, a hero image with a headline and two lines of copy, two content panels with a button, and a split section with a round image, a title, body lines and a button.</desc>
  <defs>
    <!-- the pencil wobble: a little noise pushed through the strokes -->
    <filter id="pencil" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- faint ruling under everything, like layout paper -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#143c66" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <!-- the cross that marks a picture box -->
    <symbol id="pic" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path d="M0 0 100 100M100 0 0 100" fill="none" stroke="#9aa9bd" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    </symbol>
  </defs>

  <rect width="600" height="600" fill="#fbfcfd"/>
  <rect width="600" height="600" fill="url(#grid)"/>

  <g filter="url(#pencil)" stroke="#7d8ea1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- 1 · header: logo box left, menu ticks right -->
    <rect x="44" y="26" width="66" height="22" rx="2"/>
    <path d="M52 37h50" stroke-width="3" stroke="#a9b6c7"/>
    <path d="M338 37h28M378 37h34M424 37h22M458 37h26M496 37h30M538 37h22" stroke-width="2.6" stroke="#b6c1cf"/>

    <!-- 2 · hero: a picture box with the headline set over it -->
    <rect x="32" y="66" width="536" height="250" rx="2" fill="#f1f4f8"/>
    <use href="#pic" x="32" y="66" width="536" height="250" opacity=".55"/>
    <!-- the headline, drawn as a heavy bar, and two lines under it -->
    <path d="M166 142h268" stroke-width="12" stroke="#8c9bb0"/>
    <path d="M196 170h208M214 186h172" stroke-width="4" stroke="#a9b6c7"/>

    <!-- 3 · the two panels, laid over the foot of the hero -->
    <rect x="118" y="238" width="176" height="112" rx="2" fill="#ffffff"/>
    <path d="M136 258h92M136 270h70" stroke-width="4" stroke="#a9b6c7"/>
    <path d="M136 292h8M150 292h60M136 306h8M150 306h72M136 320h8M150 320h56M136 334h8M150 334h48" stroke-width="3" stroke="#b6c1cf"/>
    <rect x="304" y="238" width="178" height="112" rx="2" fill="#e7ecf3"/>
    <path d="M322 260h118" stroke-width="5" stroke="#8c9bb0"/>
    <path d="M322 280h140M322 292h126M322 304h132" stroke-width="3" stroke="#a9b6c7"/>
    <rect x="322" y="322" width="38" height="14" rx="2" stroke="#8c9bb0"/>

    <!-- 4 · the split section: a round picture, then title, copy, button -->
    <rect x="32" y="374" width="536" height="176" rx="2"/>
    <circle cx="150" cy="462" r="66" fill="#f1f4f8"/>
    <path d="M104 416l92 92M196 416l-92 92" stroke="#9aa9bd" stroke-width="1.4" opacity=".55"/>
    <path d="M262 420h186" stroke-width="8" stroke="#8c9bb0"/>
    <path d="M262 442h222M262 456h190" stroke-width="4" stroke="#a9b6c7"/>
    <path d="M262 478h212M262 490h180M262 502h198" stroke-width="3" stroke="#b6c1cf"/>
    <rect x="262" y="518" width="66" height="16" rx="2" stroke="#8c9bb0"/>

    <!-- 5 · the next band, just starting -->
    <path d="M32 574h536" stroke-width="2.2" stroke="#b6c1cf" stroke-dasharray="4 8"/>
  </g>

  <!-- a red-pencil note on the call to action, the way a draft gets marked up -->
  <g filter="url(#pencil)" fill="none" stroke="#c25050" stroke-width="1.6" stroke-linecap="round" opacity=".8">
    <ellipse cx="341" cy="329" rx="30" ry="12"/>
    <path d="M370 322c18-10 34-18 56-22"/>
  </g>
  <text x="430" y="300" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#c25050" opacity=".85" transform="rotate(-6 430 300)">cta here?</text>
</svg>
